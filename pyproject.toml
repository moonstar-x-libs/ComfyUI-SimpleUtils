[build-system]
requires = ["setuptools>=70.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ComfyUI-SimpleUtils"
version = "0.0.1"
description = "A collection of simple utility nodes for ComfyUI"
authors = [
  {name = "moonstar-x", email = "christian.lopez99@outlook.com"}
]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = []
dependencies = [
    "numpy",
    "pillow",
    "torch",
]

[project.optional-dependencies]
dev = [
    "black",
    "bump-my-version",
    "coverage",  # testing
    "mypy",  # linting
    "pre-commit", # runs linting on commit
    "pytest",  # testing
    "ruff",  # linting
]

[project.urls]
Repository = "https://github.com/moonstar-x-libs/ComfyUI-SimpleUtils"
BugTracker = "https://github.com/moonstar-x-libs/ComfyUI-SimpleUtils/issues"
Documentation = "https://github.com/moonstar-x-libs/ComfyUI-SimpleUtils/wiki"

[tool.comfy]
PublisherId = "moonstar-x"
DisplayName = "ComfyUI-SimpleUtils"
Icon = ""
Tags = []
Repository = "https://github.com/moonstar-x-libs/ComfyUI-SimpleUtils"

includes = []

[tool.setuptools.package-data]
"*" = ["*.*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = [
    "tests",
]

[tool.mypy]
files = "."

# Use strict defaults
strict = true
warn_unreachable = true
warn_no_return = true

[[tool.mypy.overrides]]
# Don't require test functions to include types
module = "tests.*"
allow_untyped_defs = true
disable_error_code = "attr-defined"

[tool.ruff]
line-length = 140
src = ["src", "tests"]
target-version = "py39"

[tool.ruff.lint]
# Enable every rule Ruff offers, then opt out only of rules that conflict with each other or with the formatter.
select = ["ALL"]
ignore = [
    "D203",    # one-blank-line-before-class (conflicts with D211)
    "D213",    # multi-line-summary-second-line (conflicts with D212)
    "COM812",  # missing-trailing-comma (conflicts with the formatter)
    "ISC001",  # single-line-implicit-string-concatenation (conflicts with the formatter)
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "S101",     # assert is the point of pytest
    "D",        # docstrings not required in tests
    "ANN",      # type annotations not required in tests (matches mypy override)
    "PLR2004",  # magic values are fine in assertions
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.flake8-quotes]
inline-quotes = "double"
